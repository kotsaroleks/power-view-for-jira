name: Publish enterprise extension update

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/enterprise-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      - name: Write signing key
        env:
          EXTENSION_PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}
        run: |
          test -n "$EXTENSION_PRIVATE_KEY"
          printf '%s\n' "$EXTENSION_PRIVATE_KEY" > "$RUNNER_TEMP/power-view-for-jira.pem"
          chmod 600 "$RUNNER_TEMP/power-view-for-jira.pem"

      - name: Package signed CRX and update manifest
        env:
          EXTENSION_PRIVATE_KEY_PATH: ${{ runner.temp }}/power-view-for-jira.pem
          EXTENSION_CRX_URL: https://kotsaroleks.github.io/power-view-for-jira/power-view-for-jira.crx
        run: pnpm package:enterprise

      - name: Add privacy policy page
        run: cp docs/privacy.html dist/enterprise/privacy.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/enterprise

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
