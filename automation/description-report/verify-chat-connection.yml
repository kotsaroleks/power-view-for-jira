name: Verify Google Chat connection
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-description-report
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify delivery and save the receipt privately
        env:
          CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          let stage = 'private configuration';
          try {
            const root = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
            const headers = {Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'};
            async function github(path, method='GET', body) {
              const response = await fetch(root+path,{method,headers,redirect:'error',...(body===undefined?{}:{body:JSON.stringify(body)}),signal:AbortSignal.timeout(30000)});
              if (response.status===404 && method==='GET') return undefined;
              if (!response.ok) throw new Error('GitHub HTTP '+response.status);
              return response.json();
            }
            const repo = await github('');
            if (!repo?.private) throw new Error('Private repository required');
            const file = await github('/contents/config.json?ref=main');
            const config = JSON.parse(Buffer.from(file.content,'base64').toString('utf8'));
            const raw = process.env.CHAT_WEBHOOK?.trim();
            const url = new URL(raw);
            const fingerprint = createHash('sha256').update(raw).digest('hex');
            if (url.origin!=='https://chat.googleapis.com' || url.pathname!=='/v1/spaces/'+config.chatSpace+'/messages' || url.username || url.password || url.hash || !url.searchParams.get('key') || !url.searchParams.get('token') || [...url.searchParams.keys()].some(key=>!['key','token'].includes(key)) || fingerprint!==config.chatWebhookFingerprint) throw new Error('Webhook mismatch');
            const receiptPath = '/contents/state/chat-connection.json';
            const saved = await github(receiptPath+'?ref=main');
            const previous = saved ? JSON.parse(Buffer.from(saved.content,'base64').toString('utf8')) : undefined;
            if (previous?.fingerprint===fingerprint && previous?.messageName?.startsWith('spaces/'+config.chatSpace+'/messages/')) {
              console.log(JSON.stringify({chatConnectionVerified:true,alreadyConfirmed:true}));
            } else {
              const hex=createHash('sha256').update(fingerprint+':power-view-connection-v1').digest('hex').slice(0,32);
              const requestId=`${hex.slice(0,8)}-${hex.slice(8,12)}-4${hex.slice(13,16)}-a${hex.slice(17,20)}-${hex.slice(20)}`;
              const messageId='client-'+requestId;
              url.searchParams.set('messageId',messageId);
              stage='Google Chat confirmation';
              const response=await fetch(url,{method:'POST',redirect:'error',headers:{'Content-Type':'application/json; charset=UTF-8'},body:JSON.stringify({text:'Power View підключено. Щоденна перевірка змін описів задач — о 21:00 за Києвом. Якщо змін немає, репорт не надсилається.'}),signal:AbortSignal.timeout(30000)});
              let message;
              if (response.status===409) {
                const error=await response.json();
                if (error.error?.status!=='ALREADY_EXISTS') throw new Error('Chat HTTP 409');
                message={name:'spaces/'+config.chatSpace+'/messages/'+messageId};
              } else {
                if (!response.ok) throw new Error('Chat HTTP '+response.status);
                message=await response.json();
              }
              if (typeof message.name!=='string' || !message.name.startsWith('spaces/'+config.chatSpace+'/messages/')) throw new Error('Receipt missing');
              stage='private receipt save';
              const receipt={schemaVersion:1,chatSpace:config.chatSpace,fingerprint,requestId,messageId,messageName:message.name,verifiedAt:new Date().toISOString()};
              await github(receiptPath,'PUT',{message:'Confirm Google Chat report connection',branch:'main',content:Buffer.from(JSON.stringify(receipt)).toString('base64'),...(saved?{sha:saved.sha}:{})});
              console.log(JSON.stringify({chatConnectionVerified:true,receiptSaved:true}));
            }
          } catch (error) {
            const status=/^(?:Chat|GitHub) HTTP \d{3}$/.test(error?.message??'') ? ' ('+error.message+')' : '';
            console.error('Connection verification stopped during '+stage+status+'. No webhook URL or credential was logged.');
            process.exitCode=1;
          }
          JS
